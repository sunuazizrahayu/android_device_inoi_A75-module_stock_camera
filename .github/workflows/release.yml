name: Release Module

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version from commit message
        id: ver
        run: |
          MSG="$(git log -1 --pretty=%B)"
          echo "Commit message: $MSG"
          # Dua channel (case-insensitive), masing-masing 2 pola:
          #   release (stabil):      [release 1.0.1], [Release v1.2], [release] 1.0.1, [release]: v1.2.3
          #   test (pre-release):    [test 1.2.4], [Test v1.2], [test] 1.2.4, [test]: v1.2.4
          # Hasil tag/judul:  release 1.2.3 -> v1.2.3  ;  test 1.2.4 -> v1.2.4-test
          VER_RE='v?[0-9]+\.[0-9]+(\.[0-9]+)?'
          VERSION=""
          CHANNEL=""
          if echo "$MSG" | grep -qiE "\[release[[:space:]]+${VER_RE}\]"; then
            VERSION="$(echo "$MSG" | grep -oiE "\[release[[:space:]]+${VER_RE}\]" | head -n1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')"
            CHANNEL="release"
          elif echo "$MSG" | grep -qiE "\[release\][[:space:]:-]*${VER_RE}"; then
            VERSION="$(echo "$MSG" | grep -oiE "\[release\][[:space:]:-]*${VER_RE}" | head -n1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')"
            CHANNEL="release"
          elif echo "$MSG" | grep -qiE "\[test[[:space:]]+${VER_RE}\]"; then
            VERSION="$(echo "$MSG" | grep -oiE "\[test[[:space:]]+${VER_RE}\]" | head -n1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')"
            CHANNEL="test"
          elif echo "$MSG" | grep -qiE "\[test\][[:space:]:-]*${VER_RE}"; then
            VERSION="$(echo "$MSG" | grep -oiE "\[test\][[:space:]:-]*${VER_RE}" | head -n1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')"
            CHANNEL="test"
          fi
          if [ -n "$VERSION" ] && [ -n "$CHANNEL" ]; then
            if [ "$CHANNEL" = "test" ]; then
              TAG="v$VERSION-test"
              PRE="true"
            else
              TAG="v$VERSION"
              PRE="false"
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
            echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
            echo "Detected $CHANNEL version: $VERSION -> tag $TAG"
          else
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "No [release ...] or [test ...] tag in commit message, skipping."
          fi

      - name: Stop if not a release commit
        if: steps.ver.outputs.do_release != 'true'
        run: echo "Bukan commit rilis/test, workflow berhenti."

      - name: Resolve APK URL
        id: apk
        if: steps.ver.outputs.do_release == 'true'
        env:
          VARS_URL: ${{ vars.SXS_APK_URL }}
        run: |
          URL=""
          if [ -f "apk-url.txt" ]; then
            URL="$(tr -d ' \t\r\n' < apk-url.txt)"
            echo "APK URL dari apk-url.txt"
          fi
          if [ -z "$URL" ] && [ -n "$VARS_URL" ]; then
            URL="$VARS_URL"
            echo "APK URL dari repo Variable SXS_APK_URL"
          fi
          if [ -z "$URL" ]; then
            echo "::error::APK URL tidak ditemukan. Isi file apk-url.txt ATAU set repo Variable SXS_APK_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # mask URL kalau mengandung token
          echo "::add-mask::$URL" || true

      - name: Download APK
        if: steps.ver.outputs.do_release == 'true'
        env:
          APK_URL: ${{ steps.apk.outputs.url }}
        run: |
          mkdir -p system/app/SXS_Camera
          echo "Mengunduh APK..."
          curl -fSL --retry 3 --connect-timeout 30 "$APK_URL" -o system/app/SXS_Camera/SXS_Camera.apk
          ls -lh system/app/SXS_Camera/SXS_Camera.apk
          SIZE="$(stat -c%s system/app/SXS_Camera/SXS_Camera.apk)"
          if [ "$SIZE" -lt 1048576 ]; then
            echo "::error::APK hasil download mencurigakan (size=$SIZE bytes < 1MB)."
            exit 1
          fi
          file system/app/SXS_Camera/SXS_Camera.apk || true

      - name: Prepare module.prop (version + versionCode)
        if: steps.ver.outputs.do_release == 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          CHANNEL="${{ steps.ver.outputs.channel }}"
          # versionCode pakai run_number agar selalu naik (syarat Magisk/KernelSU)
          CODE="${{ github.run_number }}"
          echo "Setting version=$TAG versionCode=$CODE"
          sed -i -E "s/^version=.*/version=$TAG/" module.prop
          sed -i -E "s/^versionCode=.*/versionCode=$CODE/" module.prop
          # Kanal update: stabil -> update.json, test -> update-test.json
          if [ "$CHANNEL" = "test" ]; then JSON_FILE="update-test.json"; else JSON_FILE="update.json"; fi
          echo "Update channel file: $JSON_FILE"
          # Pastikan updateJson ada (untuk auto-update di Magisk/KernelSU)
          REPO="${{ github.repository }}"
          RAW_URL="https://raw.githubusercontent.com/$REPO/main/$JSON_FILE"
          if grep -q '^updateJson=' module.prop; then
            sed -i -E "s|^updateJson=.*|updateJson=$RAW_URL|" module.prop
          else
            echo "updateJson=$RAW_URL" >> module.prop
          fi
          cat module.prop

      - name: Build flashable zip
        if: steps.ver.outputs.do_release == 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          MODID="$(grep -E '^id=' module.prop | cut -d= -f2 | tr -d ' \t\r\n')"
          [ -n "$MODID" ] || MODID="magisk-module"
          ZIP_NAME="${MODID}-${TAG}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          # Bungkus isi modul (tanpa .git, .github, apk-url, dan update.json)
          FILES="module.prop service.sh customize.sh sepolicy.rule META-INF system"
          INCLUDE=""
          for f in $FILES; do
            if [ -e "$f" ]; then INCLUDE="$INCLUDE $f"; else echo "Lewati (tidak ada): $f"; fi
          done
          # sertakan action.sh / post-fs-data.sh / uninstall.sh / system.prop kalau nanti ditambahkan
          for f in action.sh post-fs-data.sh uninstall.sh system.prop; do
            if [ -e "$f" ]; then INCLUDE="$INCLUDE $f"; fi
          done
          # shellcheck disable=SC2086
          zip -r9 "$ZIP_NAME" $INCLUDE -x '*.git*' '*.github*' 'update*.json' '*.DS_Store*'
          echo "--- isi zip ---"
          unzip -l "$ZIP_NAME"

      - name: Build changelog
        if: steps.ver.outputs.do_release == 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # Ambil log sejak tag sebelumnya (kalau ada), kalau tidak ambil 10 commit terakhir
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          if [ -n "$PREV_TAG" ]; then
            echo "Prev tag: $PREV_TAG"
            git log "$PREV_TAG..HEAD" --pretty='- %s (%h)' > changelog.txt
          else
            git log -10 --pretty='- %s (%h)' > changelog.txt
          fi
          cat changelog.txt || echo "- rilis $TAG" > changelog.txt

      - name: Create GitHub Release (stable / pre-release)
        if: steps.ver.outputs.do_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          PRE="${{ steps.ver.outputs.prerelease }}"
          # Hapus rilis/tag lama dgn versi sama supaya re-run aman
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Rilis $TAG sudah ada — hapus dulu untuk rebuild."
            gh release delete "$TAG" -y
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git push --delete origin "$TAG" || true
            git tag -d "$TAG" || true
          fi
          FLAGS=""
          if [ "$PRE" = "true" ]; then FLAGS="--prerelease"; echo "Pre-release (test channel)."; fi
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file changelog.txt \
            $FLAGS \
            "$ZIP_NAME"

      - name: Update update.json for Magisk/KSU auto-update
        # Hanya untuk channel stabil — build test tidak menimpa kanal update stabil
        if: steps.ver.outputs.do_release == 'true' && steps.ver.outputs.channel != 'test'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          CODE="${{ github.run_number }}"
          REPO="${{ github.repository }}"
          ZIP_URL="https://github.com/$REPO/releases/download/$TAG/$ZIP_NAME"
          CHANGELOG_JSON="$(python3 -c 'import json; print(json.dumps(open("changelog.txt").read().strip()))')"
          cat > update.json <<EOF
          {
            "version": "$TAG",
            "versionCode": $CODE,
            "zipUrl": "$ZIP_URL",
            "changelog": $CHANGELOG_JSON
          }
          EOF
          cat update.json
          # Commit balik update.json + module.prop tanpa memicu rilis baru
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add update.json module.prop
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
          else
            # PENTING: pesan ini TIDAK mengandung [release ...]/[test ...] supaya tidak loop
            git commit -m "chore: update to $TAG [skip ci]"
            git push origin HEAD:main
          fi

      - name: Update update-test.json (test channel)
        # Hanya untuk channel test — rilis stabil tidak menyentuh kanal test
        if: steps.ver.outputs.do_release == 'true' && steps.ver.outputs.channel == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          CODE="${{ github.run_number }}"
          REPO="${{ github.repository }}"
          ZIP_URL="https://github.com/$REPO/releases/download/$TAG/$ZIP_NAME"
          CHANGELOG_JSON="$(python3 -c 'import json; print(json.dumps(open("changelog.txt").read().strip()))')"
          cat > update-test.json <<EOF
          {
            "version": "$TAG",
            "versionCode": $CODE,
            "zipUrl": "$ZIP_URL",
            "changelog": $CHANGELOG_JSON
          }
          EOF
          cat update-test.json
          # Commit balik HANYA update-test.json (module.prop di repo tetap di kanal stabil)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add update-test.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
          else
            # PENTING: pesan ini TIDAK mengandung [release ...]/[test ...] supaya tidak loop
            git commit -m "chore: update test channel to $TAG [skip ci]"
            git push origin HEAD:main
          fi
